<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>EventFlow – Kenya's Event Platform</title>
    <meta name="description" content="Discover and book events across Kenya. Concerts, conferences, workshops, festivals and more. Pay instantly via M-Pesa." />
    <meta name="keywords" content="events Kenya, Nairobi events, M-Pesa booking, concerts Kenya, conferences Nairobi, EventFlow" />
    <meta name="author" content="EventFlow" />
    <meta name="theme-color" content="#6366F1" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EventFlow – Kenya's #1 Event Platform" />
    <meta property="og:description" content="Discover and book events across Kenya. Pay via M-Pesa in seconds." />
    <meta property="og:url" content="https://eventflow.co.ke" />
    <meta property="og:image" content="https://eventflow.co.ke/og-image.png" />
    <meta property="og:locale" content="en_KE" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EventFlow – Kenya's #1 Event Platform" />
    <meta name="twitter:description" content="Discover and book events across Kenya. Pay via M-Pesa in seconds." />
    <meta name="twitter:image" content="https://eventflow.co.ke/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />

    <!-- Preconnect for faster Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body { background: #0A0A0F; color: #F0F0F5; font-family: 'Outfit', 'DM Sans', sans-serif; }
      #root { min-height: 100vh; }
      /* Scrollbar styling */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.4); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(99,102,241,0.7); }
      /* Smooth scroll */
      html { scroll-behavior: smooth; }
      /* Remove input autofill yellow */
      input:-webkit-autofill { -webkit-box-shadow: 0 0 0 30px #12121A inset !important; -webkit-text-fill-color: #F0F0F5 !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
